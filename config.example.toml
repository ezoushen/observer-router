# observer-router configuration.
#
# Copy to ~/.config/observer-router/config.toml (or point OBSERVER_ROUTER_CONFIG elsewhere).
# Each [providers.<name>] table is one upstream instance; several may share a type, and each
# has its own circuit breaker and quota block. `chain` is the order they are tried in, by name;
# without it the tables' order is used. OBSERVER_ROUTER_CHAIN overrides it at start-up with a
# comma-separated list of names, e.g. to drop a local lane during a benchmark.
#
# A chain entry may also name a [groups.<name>] table. A group rotates: each request starts at
# the next member in turn, and the remaining members follow, so load spreads across several keys
# and a failing or quota-blocked member still falls over inside the group before the chain moves
# on. A provider may appear only once in the chain, directly or through a group.
#
# Secrets never go in this file. A provider names where its key lives:
#   api_key_env  = "NAME"              an environment variable, checked first
#   api_key_file = "path"              a dotenv-style file (NAME=value), or a JSON object when
#   api_key_var  = "NAME"              the path ends in .json; re-read on every request
# An inline api_key is rejected.
#
# Types:
#   gemini      Google's OpenAI-compatible endpoint; daily-quota 429s block until midnight Pacific
#   openrouter  OpenRouter; reasoning is disabled per request, X-RateLimit-Reset blocks the tier
#   openai      any OpenAI-compatible endpoint (a local lane, a bridge); url required, key optional
#
# Common fields: type, model, url (defaults for gemini and openrouter), budget_s (seconds to the
# first content delta; defaults gemini 18, openrouter 24, openai 40), api_key_env, api_key_file,
# api_key_var, buffer_stream, reject_models, min_budget_s. The budgets of the instances that can
# fail before the one that answers add up; the router's request deadline,
# OBSERVER_REQUEST_DEADLINE_SECONDS (85 s by default), caps them all, counted from the request's
# arrival. For claude-mem 15.2.1 a streamed call is bound by CLAUDE_MEM_LLM_STREAM_IDLE_TIMEOUT_MS
# (90 s by default) until the router's headers arrive, and the whole call by
# CLAUDE_MEM_LLM_TIMEOUT_MS (180 s by default).
#
# The chain below is one example; list your own providers in the order you want them tried.

chain = ["gemini", "openrouter", "cursor", "local"]

# Two Gemini keys taking turns.
[groups.gemini]
members = ["gemini-a", "gemini-b"]

[providers.gemini-a]
type = "gemini"
model = "gemini-flash-lite-latest"
api_key_env = "GEMINI_API_KEY_A"

[providers.gemini-b]
type = "gemini"
model = "gemini-flash-lite-latest"
api_key_file = "~/.config/observer-router/secrets.env"
api_key_var = "GEMINI_API_KEY_B"

[providers.openrouter]
type = "openrouter"
model = "openrouter/free"
api_key_file = "~/.config/observer-router/secrets.env"
api_key_var = "OPENROUTER_API_KEY"
# site_url = "https://example.com"   # optional HTTP-Referer attribution
# app_name = "observer-router"       # X-Title attribution (this is the default)
# openrouter/free picks the model; a reply from one listed here fails over like an empty one.
# reject_models = ["nvidia/nemotron-3.5-content-safety:free"]   # a classifier, not a writer

# A cursor-api-proxy bridge in front of Cursor's subscription models. The key is the bridge's
# own, read from the bridge's env file so there is one copy of it.
[providers.cursor]
type = "openai"
url = "http://127.0.0.1:8765/v1/chat/completions"
model = "composer-2.5"
api_key_file = "~/path/to/cursor-proxy.cfg"
api_key_var = "CURSOR_BRIDGE_API_KEY"
budget_s = 40

# A GPU lane on this machine. model must match the id the server advertises at /v1/models.
[providers.local]
type = "openai"
url = "http://127.0.0.1:1240/v1/chat/completions"
model = "local-model"
budget_s = 70
reasoning_effort = "none"   # sent as-is; omit for servers that reject unknown fields (mlx_lm)
# chat_template_kwargs = { enable_thinking = false }   # Qwen on mtplx/vLLM, which ignore the above
serial = true               # one request at a time per lane URL
ac_only = true              # skipped while a laptop runs on battery
# buffer_stream = true      # any type: hold a stream until it ends; a reply cut off at the
                            # token limit then fails over, at the cost of sending nothing until
                            # it is whole.
                            # budget_s then bounds the whole reply: keep it under the client's
                            # stream idle timeout (claude-mem: 90 s)
# min_budget_s = 30         # any type: not called, nor waited for while serial, once less than
                            # this is left of the request deadline (default 1)
# Wait until these interactive lanes' Prometheus /metrics (Splash counters) have been idle for
# idle_seconds before using this lane.
# idle_metrics = ["http://127.0.0.1:1241/metrics"]
# idle_seconds = 30
# idle_signal = { in_flight = ["vllm:num_requests_running", "vllm:num_requests_waiting"] }
#   which /metrics names mean the lane is busy, when it is not Splash. Or counters:
#   { submitted = "name_total", finished = ["done_total", "failed_total"] }
# Per-provider overrides of the router-wide settings (any type); unset, the router-wide value
# applies. Edit the file and restart: nothing here is in the code.
# max_prompt_chars = 96000    # fold the prompt to this size for this provider only. Size it from
#                             # the lane: GET <base>/v1/models shows context_length (tokens);
#                             # (context - reply cap) * ~3.5 chars per token. It only tightens the
#                             # router-wide OBSERVER_MAX_PROMPT_CHARS, never raises it.
# break_after = 5             # failures in a row before this provider is skipped
# break_seconds = 120         # how long it is skipped (also when a group block skips it)
